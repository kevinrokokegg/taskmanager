<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskManager | Gestor de tareas</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>TaskManager</h1>
        <p>Organiza tus tareas y controla tu progreso.</p>
    </header>

    <main>
        <section aria-labelledby="titulo-dashboard">
            <h2 id="titulo-dashboard">Resumen de tareas</h2>

            <div class="metricas" aria-live="polite">
                <p>
                    Total
                    <strong id="total-tareas">0</strong>
                </p>

                <p>
                    Pendientes
                    <strong id="tareas-pendientes">0</strong>
                </p>

                <p>
                    Completadas
                    <strong id="tareas-completadas">0</strong>
                </p>
            </div>
        </section>

        <section aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Nueva tarea</h2>

            <form id="formulario-tarea" novalidate>
                <label for="titulo-tarea">Título de la tarea</label>

                <input
                    type="text"
                    id="titulo-tarea"
                    name="titulo"
                    placeholder="Ejemplo: estudiar JavaScript"
                    required
                >

                <label for="prioridad-tarea">Prioridad</label>

                <select id="prioridad-tarea" name="prioridad">
                    <option value="alta">Alta</option>
                    <option value="media" selected>Media</option>
                    <option value="baja">Baja</option>
                </select>

                <button type="submit">Agregar tarea</button>
            </form>

            <p id="mensaje" role="status"></p>
        </section>

        <section aria-labelledby="titulo-lista">
            <h2 id="titulo-lista">Mis tareas</h2>

            <div class="controles">
                <div>
                    <label for="buscar-tarea">Buscar por título</label>

                    <input
                        type="search"
                        id="buscar-tarea"
                        placeholder="Escribe para buscar..."
                    >
                </div>

                <div>
                    <label for="filtro-estado">Filtrar por estado</label>

                    <select id="filtro-estado">
                        <option value="todas">Todas</option>
                        <option value="pendientes">Pendientes</option>
                        <option value="completadas">Completadas</option>
                    </select>
                </div>

                <div>
                    <label for="orden-tareas">Ordenar tareas</label>

                    <select id="orden-tareas">
                        <option value="recientes">
                            Más recientes primero
                        </option>
                        <option value="antiguas">
                            Más antiguas primero
                        </option>
                        <option value="prioridad">
                            Prioridad: alta, media, baja
                        </option>
                    </select>
                </div>
            </div>

            <ul id="lista-tareas"></ul>
        </section>
    </main>

    <footer>
        <p>Desarrollado por Kevin Herrera</p>
    </footer>
</body>
</html>
